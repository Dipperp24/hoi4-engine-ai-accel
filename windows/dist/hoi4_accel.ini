; ============================================================================
; HoI4 Native Engine & AI Accelerator v1.0 (Operation Postern v1.20.0.0.8873)
; Поддерживается одинаково на Windows (рядом с version.dll и hoi4.exe)
; и на Linux (рядом с libhoi4_rust_accel.so или в папке проекта).
; ============================================================================

[hoi4_accel]
; Режим работы (пресет):
;   smooth   — (Рекомендуется) Плавный интерфейс ~30+ FPS на 5-й скорости (60 FPS при движении камеры) + максимум оптимизаций движка и ИИ
;   balanced — Упор на скорость промотки времени (~14-18 FPS на 5-й скорости)
;   turbo    — Максимальная скорость симуляции (для быстрой промотки мирных лет)
;   pure     — Все внутренние оптимизации памяти/потоков/ИИ + анти-фриз 30 FPS (без мульти-тика, MP-safe для чистого рендера)
;   none     — Полностью отключить все патчи (чистый прокси / passthrough)
preset = smooth

; Запись подробного отчёта профилировщика зон при выходе из игры (0 = выкл, 1 = вкл)
profile = 0

; --- Новые глубокие оптимизации движка и ИИ в v1.0 (по умолчанию все = 1 в пресетах smooth/balanced/turbo/pure) ---
; fast_alloc = 1          ; Lock-free slab-аллокатор 128 МБ + TLS-кэш потоков для CPdxNewDeleteAllocator (<= 512 байт без блокировок кучи)
; fast_mod = 1            ; Безветвевой (CMOV) бинарный поиск модификаторов CModifier::GetValue (ноль ошибок предсказания переходов CPU)
; country_grain = 1       ; Адаптивный размер чанка chunk=1 для параллельных циклов по странам (17..220 стран — мажоры не тормозят пул потоков)
; civil_war_fix = 1       ; Устранение многосекундного фриза при начале гражданских войн (коалесценция 100+ пересборок карты/побережий в 1)
; ai_smart_supply = 1     ; Умная логистика ИИ: ежедневная проверка узких мест снабжения (24ч вместо 168ч) и высший приоритет стройки ЖД и хабов снабжения
; ai_throttle_minors = 1  ; Разгрузка CPU от спящих мирных миноров (<12 областей, вне войны, не мажор, не игрок): шаг раз в 4ч с сохранением дневных таймеров

; --- Базовые настройки планировщика потоков, кадров и ввода-вывода (раскомментируйте для ручного переопределения) ---
; target_fps = 26
; smooth_fps = 30
; max_burst = 16
; fast_sched = 1
; fast_wait = 1
; fast_yield = 1
; no_job_clock = 1
; affinity = 1
; quiet_log = 1
; fast_save = 1
; no_telemetry = 1
