[package]
name = "hoi4-rust-accel"
version = "1.0.0"
edition = "2024"
description = "Native Rust v1.0 engine & AI accelerator for Hearts of Iron IV (Linux x86_64)"

[lib]
name = "hoi4_rust_accel"
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = false
